name: Sync with WordCraft

# Every night: merge WordCraft's main, run the full quality gate, and push to main when it passes.
# When the merge or the gate fails, nothing is pushed and an issue is opened (or updated) and
# assigned to the maintainer, so GitHub emails him; a later passing night closes it.
on:
  schedule:
    - cron: "0 8 * * *" # 3 a.m. Central daylight time, 2 a.m. standard
  workflow_dispatch:
    inputs:
      alert-test:
        description: "Fail on purpose, to check that the failure email reaches the maintainer"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: sync
  cancel-in-progress: false

env:
  CRAFT_FONTS_REF: bfcbf714e45a3ea8e98f88ab2b7971372a576414
  MAINTAINER: pattalkslaw-del
  ISSUE_TITLE: "Nightly WordCraft sync needs attention"

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      # The deploy key (write access to this repository only) pushes the merge, workflow files
      # included, which GITHUB_TOKEN may not.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts

      - name: Install Linux build dependencies (winit, wgpu, rfd)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers

      - name: Install Rust (stable + clippy, rustfmt, wasm32)
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt \
            --target wasm32-unknown-unknown
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # WordCraft's gate runs the tests with cargo-nextest, one process per test, and some of its
      # tests count on that (a fresh process numbers documents from 1); LawCraft's gate does the same.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.150

      - name: Alert test
        if: inputs.alert-test
        run: |
          echo "error: alert test requested; failing on purpose" >&2
          exit 1

      - name: Merge WordCraft main
        id: merge
        run: |
          git config user.name "LawCraft sync"
          git config user.email "245314230+pattalkslaw-del@users.noreply.github.com"
          .github/sync/sync.sh

      - name: Check out craft-i18n
        if: steps.merge.outputs.result == 'merged'
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@9e42334399655e6838f234c912d29c0697cad477 # craft-common-actions main, 2026-10-24

      - name: Quality gate
        if: steps.merge.outputs.result == 'merged'
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cargo xtask ci

      - name: Push
        if: steps.merge.outputs.result == 'merged'
        run: git push origin HEAD:main

      - name: Close the attention issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for n in $(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '.[] | select(.title == env.ISSUE_TITLE) | .number'); do
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" -f body="Tonight's sync passed: $run" --silent
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$n" -f state=closed --silent
          done

      # An issue assigned to the maintainer, mentioning him, so GitHub emails him. REST, not
      # `gh issue`: the GraphQL createIssue call is refused to this workflow's token.
      - name: Tell the maintainer
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          ALERT_TEST: ${{ inputs.alert-test }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$ALERT_TEST" = true ]; then
            why="This is a test of the sync's failure alert. Nothing is wrong; close this issue."
          elif [ -n "$CONFLICTS" ]; then
            why="Merging WordCraft's main conflicts with LawCraft in: \`$CONFLICTS\`. Nothing was pushed."
          else
            why="The nightly sync failed before or during the quality gate (\`cargo xtask ci\`). Nothing was pushed."
          fi
          body="@$MAINTAINER $why

          Run: $run"
          n="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq '[.[] | select(.title == env.ISSUE_TITLE) | .number][0] // empty')"
          if [ -n "$n" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" -f body="$body" --silent
          else
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$ISSUE_TITLE" -f body="$body" -f "assignees[]=$MAINTAINER" --silent
          fi
